name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install --only-binary :all: --require-hashes -r requirements.lock
      - run: uv lock --check
      - run: python -m ruff format --check src tools noxfile.py
      - run: python -m ruff check src tools noxfile.py
      - run: python -m basedpyright
      - run: PYTHONPATH=src lint-imports
      - run: python -m semgrep --config semgrep src/trajcert
      - run: python -m vulture src/trajcert --min-confidence 100 --ignore-names table,where,compression,use_dictionary,write_statistics,field_type,nullable,value_type,fields,tz,unit
      - run: python -m deptry .
      - run: python -m coverage run -m pytest -q
      - run: python -m coverage report
      - run: python -m coverage xml
