name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: uv sync --extra quality --locked --no-build
      - run: uv run --no-sync --no-build ruff format --check src tools noxfile.py
      - run: uv run --no-sync --no-build ruff check src tools noxfile.py
      - run: uv run --no-sync --no-build basedpyright
      - run: PYTHONPATH=src uv run --no-sync --no-build lint-imports
      - run: uv run --no-sync --no-build semgrep --config semgrep src/trajcert
      - run: uv run --no-sync --no-build vulture src/trajcert --min-confidence 100 --ignore-names table,where,compression,use_dictionary,write_statistics,field_type,nullable,value_type,fields,tz,unit
      - run: uv run --no-sync --no-build deptry .
      - run: uv run --no-sync --no-build coverage run -m pytest -q
      - run: uv run --no-sync --no-build coverage report
      - run: uv run --no-sync --no-build coverage xml
