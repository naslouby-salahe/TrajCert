name: Phase 2 Targeted Validation

on:
  push:
    branches:
      - feat/trajcert-scientific-execution-spine

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: uv sync --extra quality --locked --no-build
      - name: Ruff diagnostics
        continue-on-error: true
        run: |
          uv run --no-sync --no-build ruff format --check \
            src/trajcert/analysis src/trajcert/config.py \
            src/trajcert/experiments/coverage.py src/trajcert/experiments/dispatch.py \
            src/trajcert/experiments/execution.py src/trajcert/experiments/failure_boundaries.py \
            src/trajcert/experiments/legacy_incoherence.py src/trajcert/experiments/plan.py \
            src/trajcert/experiments/registry.py src/trajcert/experiments/runner.py \
            src/trajcert/experiments/safety.py src/trajcert/experiments/sensitivity.py \
            src/trajcert/experiments/solver_validation.py src/trajcert/experiments/synthesis.py \
            src/trajcert/experiments/synthesis_execution.py \
            src/trajcert/reporting/source_data.py src/trajcert/reporting/synthesis_rows.py \
            tests/unit/test_statistics.py tests/unit/test_phase2_execution.py \
            tests/architecture/test_locality.py \
            > phase2-ruff-format.txt 2>&1
          format_status=$?
          uv run --no-sync --no-build ruff check \
            src/trajcert/analysis src/trajcert/config.py \
            src/trajcert/experiments/coverage.py src/trajcert/experiments/dispatch.py \
            src/trajcert/experiments/execution.py src/trajcert/experiments/failure_boundaries.py \
            src/trajcert/experiments/legacy_incoherence.py src/trajcert/experiments/plan.py \
            src/trajcert/experiments/registry.py src/trajcert/experiments/runner.py \
            src/trajcert/experiments/safety.py src/trajcert/experiments/sensitivity.py \
            src/trajcert/experiments/solver_validation.py src/trajcert/experiments/synthesis.py \
            src/trajcert/experiments/synthesis_execution.py \
            src/trajcert/reporting/source_data.py src/trajcert/reporting/synthesis_rows.py \
            tests/unit/test_statistics.py tests/unit/test_phase2_execution.py \
            tests/architecture/test_locality.py \
            > phase2-ruff-check.txt 2>&1
          check_status=$?
          printf 'format_status=%s\ncheck_status=%s\n' "$format_status" "$check_status" > phase2-ruff-status.txt
          exit $(( format_status || check_status ))
      - name: BasedPyright diagnostics
        continue-on-error: true
        run: |
          uv run --no-sync --no-build basedpyright \
            src/trajcert/analysis src/trajcert/config.py \
            src/trajcert/experiments/coverage.py src/trajcert/experiments/dispatch.py \
            src/trajcert/experiments/execution.py src/trajcert/experiments/failure_boundaries.py \
            src/trajcert/experiments/legacy_incoherence.py src/trajcert/experiments/plan.py \
            src/trajcert/experiments/registry.py src/trajcert/experiments/runner.py \
            src/trajcert/experiments/safety.py src/trajcert/experiments/sensitivity.py \
            src/trajcert/experiments/solver_validation.py src/trajcert/experiments/synthesis.py \
            src/trajcert/experiments/synthesis_execution.py \
            src/trajcert/reporting/source_data.py src/trajcert/reporting/synthesis_rows.py \
            > phase2-basedpyright.txt 2>&1
      - name: Compile and plan invariants
        continue-on-error: true
        run: |
          python -m compileall -q src/trajcert > phase2-compile.txt 2>&1
          compile_status=$?
          PYTHONPATH=src uv run --no-sync --no-build python - <<'PY' > phase2-plan.txt 2>&1
          from trajcert.config import TrajCertConfig
          from trajcert.constants import PRODUCTION_CONFIG_PATH
          from trajcert.experiments.plan import build_plan
          from trajcert.experiments.registry import authoritative_registry

          config = TrajCertConfig.from_yaml(PRODUCTION_CONFIG_PATH)
          registry = authoritative_registry()
          plan = build_plan(config)
          assert len(registry) == 30
          assert plan.registry_total == 1423
          assert plan.executable_cells == 1423
          assert plan.invalid_cells == 0
          assert all(item.configuration_gap_cells == 0 for item in registry)
          print("plan invariants pass")
          PY
          plan_status=$?
          printf 'compile_status=%s\nplan_status=%s\n' "$compile_status" "$plan_status" > phase2-compile-plan-status.txt
          exit $(( compile_status || plan_status ))
      - name: Targeted tests
        continue-on-error: true
        run: |
          uv run --no-sync --no-build pytest -q \
            tests/unit/test_config.py tests/unit/test_statistics.py \
            tests/unit/test_phase2_execution.py tests/architecture/test_locality.py \
            > phase2-pytest.txt 2>&1
      - name: Static architecture diagnostics
        continue-on-error: true
        run: |
          PYTHONPATH=src uv run --no-sync --no-build lint-imports > phase2-import-linter.txt 2>&1
          uv run --no-sync --no-build semgrep --config semgrep src/trajcert > phase2-semgrep.txt 2>&1
          uv run --no-sync --no-build vulture src/trajcert --min-confidence 100 --ignore-names table,where,compression,use_dictionary,write_statistics,field_type,nullable,value_type,fields,tz,unit > phase2-vulture.txt 2>&1
          uv run --no-sync --no-build deptry . > phase2-deptry.txt 2>&1
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase2-validation-diagnostics
          path: phase2-*.txt
          if-no-files-found: error
