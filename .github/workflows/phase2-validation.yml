name: Phase 2 validation

on:
  push:
    branches:
      - feat/trajcert-scientific-execution-spine

permissions:
  contents: write

jobs:
  phase2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: uv sync --extra quality --locked --no-build
      - name: Format and lint Phase 2
        run: |
          files=(
            src/trajcert/analysis/aggregation.py
            src/trajcert/analysis/bootstrap.py
            src/trajcert/analysis/locality.py
            src/trajcert/analysis/materiality.py
            src/trajcert/analysis/metrics.py
            src/trajcert/analysis/multiplicity.py
            src/trajcert/analysis/sign_flip.py
            src/trajcert/experiments/synthesis.py
            src/trajcert/reporting/source_data.py
            tests/unit/test_statistics.py
            tests/architecture/test_locality.py
          )
          uv run --no-sync --no-build ruff format "${files[@]}"
          uv run --no-sync --no-build ruff check --fix "${files[@]}"
          if ! git diff --quiet -- "${files[@]}"; then
            git add "${files[@]}"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(phase2): format synthesis implementation'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - run: uv run --no-sync --no-build ruff format --check src/trajcert/analysis src/trajcert/experiments/synthesis.py src/trajcert/reporting/source_data.py tests/unit/test_statistics.py tests/architecture/test_locality.py
      - run: uv run --no-sync --no-build ruff check src/trajcert/analysis src/trajcert/experiments/synthesis.py src/trajcert/reporting/source_data.py tests/unit/test_statistics.py tests/architecture/test_locality.py
      - run: uv run --no-sync --no-build basedpyright src/trajcert/analysis src/trajcert/experiments/synthesis.py src/trajcert/reporting/source_data.py tests/unit/test_statistics.py tests/architecture/test_locality.py
      - run: uv run --no-sync --no-build pytest -q tests/unit/test_statistics.py tests/architecture/test_locality.py
      - run: uv run --no-sync --no-build semgrep --config semgrep src/trajcert/analysis src/trajcert/experiments/synthesis.py src/trajcert/reporting/source_data.py
      - run: uv run --no-sync --no-build deptry .
