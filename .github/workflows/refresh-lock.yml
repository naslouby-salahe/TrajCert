name: Refresh dependency lock

on:
  push:
    branches:
      - feat/trajcert-scientific-execution-spine

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - run: uv lock
      - name: Commit generated lock
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git add uv.lock
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: refresh uv lock'
          git push origin "HEAD:${GITHUB_REF_NAME}"
