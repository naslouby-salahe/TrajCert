[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "trajcert"
version = "0.1.0"
description = "Trajectory-aware partial-identification and sensitivity-certification framework"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.4",
    "pyarrow==25.0.1",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
quality = [
    "coverage==7.15.4",
    "deptry==0.25.1",
    "import-linter==2.13",
    "nox==2026.8.10",
    "pyright==1.1.411",
    "pytest==8.3.5",
    "ruff==0.14.13",
    "semgrep==1.174.0",
    "vulture==2.16",
]

[project.scripts]
trajcert = "trajcert.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trajcert"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["trajcert"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "trajcert"

[tool.deptry]
extend_exclude = ["noxfile.py"]
known_first_party = ["trajcert"]
package_module_name_map = { PyYAML = "yaml", coverage = "coverage", "import-linter" = "import_linter", nox = "nox", pydantic = "pydantic", pyarrow = "pyarrow", pyright = "pyright", pytest = "pytest", ruff = "ruff", semgrep = "semgrep", vulture = "vulture" }
optional_dependencies_dev_groups = ["quality"]

[[tool.importlinter.contracts]]
name = "domain-independent-of-upper-layers"
type = "forbidden"
source_modules = ["trajcert.domain"]
forbidden_modules = [
    "trajcert.analysis",
    "trajcert.baselines",
    "trajcert.cli",
    "trajcert.data",
    "trajcert.evaluation",
    "trajcert.experiments",
    "trajcert.infrastructure",
    "trajcert.inference",
    "trajcert.math",
    "trajcert.reporting",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
