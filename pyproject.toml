[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "trajcert"
version = "0.1.0"
description = "Trajectory-aware partial-identification and sensitivity-certification framework"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.2",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "PyYAML==6.0.3",
    "scipy==1.17.1",
    "libcst==1.8.6",
    "python-flint==0.9.0",
    "mpmath==1.3.0",
    "pyarrow==25.0.1",
    "threadpoolctl==3.6.0",
    "psutil==7.1.0",
]

[project.optional-dependencies]
quality = [
    "coverage==7.15.4",
    "basedpyright==1.37.2",
    "complexipy==5.0.0",
    "crosshair-tool==0.0.104",
    "deptry==0.25.1",
    "import-linter==2.13",
    "mutmut==3.4.0",
    "nox==2026.8.10",
    "pip-audit==2.10.0",
    "pyarrow-stubs==20.0.0.20260819",
    "types-psutil==7.2.2.20260827",
    "pytest==9.0.3",
    "pytest-archon==0.0.6",
    "pytest-cov==6.2.1",
    "pytest-randomly==3.16.0",
    "pytest-timeout==2.4.0",
    "ruff==0.14.13",
    "semgrep==1.174.0",
    "vulture==2.16",
]

[project.scripts]
trajcert = "trajcert.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trajcert"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--randomly-seed=last", "--timeout=30"]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
branch = true
source = ["trajcert"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "trajcert"

[tool.deptry]
extend_exclude = ["noxfile.py"]
known_first_party = ["trajcert"]
package_module_name_map = { PyYAML = "yaml", coverage = "coverage", "import-linter" = "import_linter", mpmath = "mpmath", nox = "nox", numpy = "numpy", pydantic = "pydantic", pyarrow = "pyarrow", "python-flint" = "flint", pyright = "pyright", pytest = "pytest", ruff = "ruff", scipy = "scipy", semgrep = "semgrep", vulture = "vulture" }
optional_dependencies_dev_groups = ["quality"]

[[tool.importlinter.contracts]]
name = "domain-independent-of-upper-layers"
type = "forbidden"
source_modules = ["trajcert.math"]
forbidden_modules = [
    "trajcert.analysis",
    "trajcert.baselines",
    "trajcert.cli",
    "trajcert.evaluation",
    "trajcert.experiments",
    "trajcert.infrastructure",
    "trajcert.inference",
    "trajcert.reporting",
]

[[tool.importlinter.contracts]]
name = "independent-oracle-does-not-reuse-production-solver"
type = "forbidden"
source_modules = ["trajcert.math.oracle", "trajcert.comparators.information_optimization"]
forbidden_modules = ["trajcert.math.solver", "trajcert.math.information"]

[[tool.importlinter.contracts]]
name = "data-does-not-orchestrate"
type = "forbidden"
source_modules = ["trajcert.data"]
forbidden_modules = ["trajcert.experiments", "trajcert.reporting", "trajcert.cli"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/architecture/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C90", "PL", "PERF", "RUF", "ARG", "PTH", "ANN", "ERA"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 9

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["tests/architecture/fixtures"]
typeCheckingMode = "all"
failOnWarnings = true
pythonVersion = "3.12"
reportMissingTypeStubs = false
stubPath = "typings"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

[tool.complexipy]
paths = ["src/trajcert"]
max_complexity = 10

[tool.mutmut]
paths_to_mutate = ["src/trajcert/config.py", "src/trajcert/types.py", "src/trajcert/math", "src/trajcert/data"]
tests_dir = ["tests/unit", "tests/architecture"]
