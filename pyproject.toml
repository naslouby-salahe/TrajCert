[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "trajcert"
version = "0.1.0"
description = "Trajectory-aware partial-identification and sensitivity-certification framework"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/trajcert"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
