[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "trajcert"
version = "0.1.0"
description = "Trajectory-aware partial-identification and sensitivity-certification framework"
requires-python = ">=3.12"
dependencies = [
    "hypothesis==6.125.3",
    "matplotlib==3.10.0",
    "mpmath==1.3.0",
    "numpy==2.5.2",
    "pandas==2.3.3",
    "pydantic==2.13.4",
    "pyarrow==25.0.1",
    "python-flint==0.9.0",
    "pytest==8.3.5",
    "PyYAML==6.0.3",
    "scipy==1.18.0",
    "sympy==1.13.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trajcert"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
